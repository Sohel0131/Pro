<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BURO Bangladesh — ক্যালকুলেটর</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Noto Sans Bengali","Nirmala UI",Arial,sans-serif;background:#f3f6fa;color:#18212b}

.buro-nav{position:sticky;top:0;z-index:1000;background:linear-gradient(135deg,#08744d,#0f766e);box-shadow:0 4px 15px rgba(0,0,0,.18)}
.buro-nav-inner{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;position:relative}
.buro-logo{color:#fff;font-weight:800;text-decoration:none;font-size:16px;display:flex;flex-direction:column;line-height:1.25;background:none;border:0;cursor:pointer;padding:0;text-align:right}
.buro-logo span{font-size:11px;font-weight:400;opacity:.85}
.buro-menu{list-style:none;display:flex;gap:2px;margin:0;padding:0}
.buro-menu button{color:#fff;background:none;border:0;text-decoration:none;padding:9px 13px;border-radius:9px;font-size:13.5px;font-weight:700;display:block;transition:background .15s;white-space:nowrap;cursor:pointer;font-family:inherit}
.buro-menu button:hover,.buro-menu button.active{background:rgba(255,255,255,.2)}
.buro-burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:6px}
.buro-burger span{width:23px;height:3px;background:#fff;border-radius:2px}
@media(max-width:760px){
  .buro-burger{display:flex}
  .buro-menu{position:absolute;top:100%;right:0;left:0;background:#08744d;flex-direction:column;padding:8px;display:none;gap:0;border-radius:0 0 14px 14px;box-shadow:0 10px 20px rgba(0,0,0,.2)}
  .buro-menu.open{display:flex}
  .buro-menu button{padding:13px 14px;border-radius:8px;text-align:right}
}

.hero{background:linear-gradient(135deg,#056b49,#13a06e);color:#fff;text-align:center;padding:46px 18px 56px}
.hero h1{margin:0 0 10px;font-size:30px;color:#ffe58a}
.hero p{margin:0;font-size:15px;opacity:.95;max-width:520px;margin:auto}

.wrap{max-width:1000px;margin:-30px auto 40px;padding:0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border-radius:18px;box-shadow:0 12px 34px rgba(15,50,40,.13);overflow:hidden;text-decoration:none;color:#18212b;display:flex;flex-direction:column;transition:transform .15s;border:0;text-align:right;cursor:pointer;font-family:inherit;width:100%}
.card:hover{transform:translateY(-3px)}
.card .top{padding:20px 20px 14px;display:flex;align-items:center;gap:12px}
.card .icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;color:#fff}
.card h2{margin:0;font-size:17px}
.card p{margin:0;padding:0 20px 20px;font-size:13.5px;color:#5c6773;line-height:1.6;text-align:right}
.card .go{margin:0 20px 20px;font-size:13px;font-weight:800;color:#08744d}

.c1 .icon{background:linear-gradient(135deg,#08744d,#11a06d)}
.c2 .icon{background:linear-gradient(135deg,#126e51,#0b8f67)}
.c3 .icon{background:linear-gradient(135deg,#08744d,#12a36d)}
.c4 .icon{background:linear-gradient(135deg,#0284c7,#0f766e)}
.c1 .go{color:#08744d}.c2 .go{color:#126e51}.c3 .go{color:#08744d}.c4 .go{color:#0284c7}

.footer{text-align:center;padding:20px;font-size:12.5px;color:#8b95a0}

#frame{display:none;width:100%;height:calc(100dvh - 58px);border:0}
#homeView.hidden,#frame.hidden{display:none}
#frame.visible{display:block}

@media(max-width:640px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>
</head>

<h1>BURO Bangladesh ক্যালকুলেটর</h1>
<p>সঞ্চয়, ঋণ, কিস্তি ও কল্যাণ তহবিল সংক্রান্ত সব হিসাব — এক জায়গায়, সহজ ও নির্ভুলভাবে।</p>
</div>

<button class="card c1" onclick="showPage('cashflow')">
<div class="top"><div class="icon">📊</div><h2>ঋণ মূল্যায়ন ক্যালকুলেটর</h2></div>
<p>আয়-ব্যয় হিসাব করে সদস্যের ধরন, কিস্তি ও মেয়াদ অনুযায়ী পরিশোধ সক্ষমতা ও চূড়ান্ত ঋণের পরিমাণ বের করুন।</p>
<div class="go">হিসাব করুন →</div>
</button>

<button class="card c2" onclick="showPage('kisti')">
<div class="top"><div class="icon">🧾</div><h2>NGO কিস্তি ক্যালকুলেটর</h2></div>
<p>BURO-এর ২৪% সুদহারের Loan Amortization Schedule অনুযায়ী ঋণের সম্পূর্ণ কিস্তি ও পরিশোধ সূচি দেখুন।</p>
<div class="go">হিসাব করুন →</div>
</button>

<button class="card c3" onclick="showPage('savings')">
<div class="top"><div class="icon">💰</div><h2>সঞ্চয় ক্যালকুলেটর</h2></div>
<p>মাসিক বা সাপ্তাহিক কিস্তিতে জমাকৃত সঞ্চয়ের মেয়াদান্তে মোট লাভ ও প্রদেয় টাকার হিসাব বের করুন।</p>
<div class="go">হিসাব করুন →</div>
</button>

<button class="card c4" onclick="showPage('kollan')">
<div class="top"><div class="icon">🛡️</div><h2>গ্রাহক কল্যাণ তহবিল</h2></div>
<p>ঋণের পরিমাণ, মেয়াদ ও কেন্দ্রের ধরন অনুযায়ী গ্রাহক কল্যাণ তহবিলের হার ও পরিমাণ হিসাব করুন।</p>
<div class="go">হিসাব করুন →</div>
</button>

</div>
</div>

function showPage(key){
  const home = document.getElementById('homeView');
  const frame = document.getElementById('frame');
  document.querySelectorAll('.buro-menu button').forEach(b=>b.classList.toggle('active', b.dataset.page===key));
  if(key==='home'){
    home.classList.remove('hidden');
    frame.classList.remove('visible');
    frame.classList.add('hidden');
    frame.src = '';
  } else {
    home.classList.add('hidden');
    frame.classList.remove('hidden');
    frame.classList.add('visible');
    frame.src = 'data:text/html;base64,' + PAGES[key];
  }
  document.getElementById('buroMenu').classList.remove('open');
  window.scrollTo(0,0);
}

document.getElementById('buroBurger').addEventListener('click', function(){
  document.getElementById('buroMenu').classList.toggle('open');
});
</script>
