<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07080d;
    --bg-1:#0d0f18;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.10);
    --border:rgba(255,255,255,0.10);
    --border-strong:rgba(255,255,255,0.20);
    --text-0:#eef0f7;
    --text-1:#9aa0b4;
    --text-2:#63687a;
    --accent-1:#5fa8ff;
    --accent-2:#b06bff;
    --accent-3:#5fe6d0;
    --accent-grad:linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --radius-lg:26px;
    --radius-md:18px;
    --shadow-soft:0 24px 70px -24px rgba(0,0,0,0.7);
    --font-display:'Outfit', sans-serif;
    --font-body:'Inter', sans-serif;
    --p-opacity:1;
    --anim-play:running;
  }
  [data-theme="light"]{
    --bg-0:#eef1f8;
    --bg-1:#e6e9f2;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.8);
    --border:rgba(20,25,45,0.09);
    --border-strong:rgba(20,25,45,0.16);
    --text-0:#181b26;
    --text-1:#4b5266;
    --text-2:#868da3;
    --shadow-soft:0 24px 70px -30px rgba(30,35,60,0.28);
  }
  [data-theme="ocean"]{
    --bg-0:#04141c;
    --bg-1:#062330;
    --glass:rgba(120,220,255,0.07);
    --glass-strong:rgba(120,220,255,0.13);
    --border:rgba(120,220,255,0.14);
    --border-strong:rgba(120,220,255,0.26);
    --text-0:#eaf9ff;
    --text-1:#8fb9c8;
    --text-2:#5c7f8c;
    --accent-1:#22c1dc;
    --accent-2:#2e8bff;
    --accent-3:#5fe6c4;
    --shadow-soft:0 24px 70px -24px rgba(0,10,20,0.75);
  }
  [data-theme="sunset"]{
    --bg-0:#160a0e;
    --bg-1:#211013;
    --glass:rgba(255,180,140,0.08);
    --glass-strong:rgba(255,180,140,0.14);
    --border:rgba(255,180,140,0.15);
    --border-strong:rgba(255,180,140,0.28);
    --text-0:#fff2ea;
    --text-1:#d9a99a;
    --text-2:#8c675c;
    --accent-1:#ff8a5c;
    --accent-2:#ff5f9e;
    --accent-3:#ffc86b;
    --shadow-soft:0 24px 70px -24px rgba(20,0,5,0.75);
  }
  [data-theme="glass"]{
    --bg-0:#0e131c;
    --bg-1:#161d29;
    --glass:rgba(210,225,255,0.10);
    --glass-strong:rgba(210,225,255,0.18);
    --border:rgba(210,225,255,0.16);
    --border-strong:rgba(210,225,255,0.30);
    --text-0:#f2f5fc;
    --text-1:#a7b2c8;
    --text-2:#6f7996;
    --accent-1:#8fa6ff;
    --accent-2:#c7d3ff;
    --accent-3:#9be3ff;
    --shadow-soft:0 24px 70px -24px rgba(0,5,20,0.7);
  }
  [data-theme="aurora"]{
    --bg-0:#050e0f;
    --bg-1:#0a1a1a;
    --glass:rgba(140,255,210,0.07);
    --glass-strong:rgba(140,255,210,0.13);
    --border:rgba(140,255,210,0.15);
    --border-strong:rgba(140,255,210,0.28);
    --text-0:#eafff5;
    --text-1:#8fc9b6;
    --text-2:#5c8577;
    --accent-1:#3ee6a8;
    --accent-2:#5fa8ff;
    --accent-3:#c76bff;
    --shadow-soft:0 24px 70px -24px rgba(0,15,10,0.75);
  }
  [data-theme="midnight"]{
    --bg-0:#0a0714;
    --bg-1:#130f22;
    --glass:rgba(180,150,255,0.08);
    --glass-strong:rgba(180,150,255,0.14);
    --border:rgba(180,150,255,0.16);
    --border-strong:rgba(180,150,255,0.30);
    --text-0:#f3efff;
    --text-1:#a99bd6;
    --text-2:#6d6193;
    --accent-1:#a06bff;
    --accent-2:#5fa8ff;
    --accent-3:#ffd76b;
    --shadow-soft:0 24px 70px -24px rgba(10,0,25,0.8);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg-0);
    color:var(--text-0);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:background .4s ease, color .4s ease;
  }
  /* animation-play-state via CSS var is unreliable because any rule that sets the
     `animation` shorthand (cardIn, driftBg, floatLogo, etc.) resets play-state back
     to running and wins on specificity. Force-pause everything with a high-specificity
     attribute selector + !important instead so the Animations toggle actually works. */
  html[data-anim="off"] *,
  html[data-anim="off"] *::before,
  html[data-anim="off"] *::after{
    animation-play-state:paused !important;
  }
  html[data-reduce="on"] *,
  html[data-reduce="on"] *::before,
  html[data-reduce="on"] *::after{
    animation-play-state:paused !important;
    transition-duration:0.001ms !important;
  }
  body.compact .page{ padding-top:56px; }
  body.compact .clock-time{ font-size:clamp(30px,7vw,42px); }
  body.compact .clock-wrap{ margin-bottom:14px; }
  body.compact .logo-mark{ width:42px; height:42px; }
  body.compact .search-wrap{ margin:14px 0 22px; }
  body.compact .search-bar{ padding:12px 16px; }
  body.compact .grid{ gap:9px; margin-bottom:20px; }
  body.compact .card{ padding:11px 6px 9px; }

  /* ---------- Background ---------- */
  .bg-layer{ position:fixed; inset:0; z-index:-2; overflow:hidden; }
  .bg-layer::before{
    content:'';
    position:absolute; inset:-25%;
    background:
      radial-gradient(circle at 18% 22%, rgba(95,168,255,0.20), transparent 42%),
      radial-gradient(circle at 82% 20%, rgba(176,107,255,0.16), transparent 45%),
      radial-gradient(circle at 55% 85%, rgba(95,230,208,0.10), transparent 50%);
    animation: driftBg 24s ease-in-out infinite alternate;
  }
  [data-theme="light"] .bg-layer::before{
    background:
      radial-gradient(circle at 18% 22%, rgba(95,168,255,0.22), transparent 42%),
      radial-gradient(circle at 82% 20%, rgba(176,107,255,0.18), transparent 45%),
      radial-gradient(circle at 55% 85%, rgba(95,230,208,0.12), transparent 50%);
  }
  .bg-layer.burst::before{ filter:brightness(1.35); }
  @keyframes driftBg{
    0%{ transform:translate(0,0) scale(1); }
    100%{ transform:translate(-3%,2%) scale(1.07); }
  }
  .bg-grid{
    position:fixed; inset:0; z-index:-1; opacity:0.35;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 70% 55% at 50% 30%, black 40%, transparent 85%);
  }
  [data-theme="light"] .bg-grid{ opacity:0.5; }
  #particles{ position:fixed; inset:0; z-index:-1; opacity:var(--p-opacity); transition:opacity .4s ease; }
  #particles canvas{ display:block; width:100%; height:100%; }
  #bgOverlay{ position:fixed; inset:0; z-index:-1; opacity:0; pointer-events:none; transition:opacity .4s ease; background-size:cover; }
  #burstLayer{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  .burst-particle{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:var(--accent-1);
    animation: burstOut 1s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes burstOut{
    to{ transform:translate(var(--bx), var(--by)) scale(0); opacity:0; }
  }

  /* ---------- Layout ---------- */
  .page{
    max-width:760px; margin:0 auto;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:80px 24px 40px;
    position:relative;
  }

  .topbar{
    position:fixed; top:20px; right:20px; display:flex; gap:10px; z-index:50;
  }
  .icon-btn{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--glass); border:1px solid var(--border);
    backdrop-filter:blur(20px);
    cursor:pointer; color:var(--text-1);
    transition:transform .25s ease, background .25s ease, color .25s ease, box-shadow .35s ease;
  }
  .icon-btn:hover{
    background:var(--glass-strong); color:var(--text-0); transform:translateY(-3px) scale(1.06);
    box-shadow:0 10px 26px -8px rgba(0,0,0,0.5), 0 0 22px -4px rgba(95,168,255,0.5);
    border-color:var(--border-strong);
  }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn.magic{ color:var(--accent-1); font-size:18px; }
  .icon-btn.magic.pulse{
    box-shadow:0 0 0 0 rgba(95,168,255,0.6);
    animation: magicPulse .8s ease;
  }
  @keyframes magicPulse{
    0%{ box-shadow:0 0 0 0 rgba(95,168,255,0.55); }
    100%{ box-shadow:0 0 0 26px rgba(95,168,255,0); }
  }

  /* ---------- Effects: AI orb, ambient glow, cursor layers ---------- */
  .ai-orb{
    width:30px; height:30px; border-radius:50%; margin:0 auto 14px;
    background:conic-gradient(from 0deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    box-shadow:0 0 24px -2px var(--accent-1), 0 0 40px -6px var(--accent-2);
    animation:orbSpin 5s linear infinite, orbFloat 4s ease-in-out infinite;
    display:none;
  }
  .ai-orb.on{ display:block; }
  @keyframes orbSpin{ to{ transform:rotate(360deg); } }
  @keyframes orbFloat{ 0%,100%{ margin-top:0; } 50%{ margin-top:-6px; } }
  .ambient-glow{
    position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0; transition:opacity .5s ease;
  }
  .ambient-glow.on{ opacity:1; }
  .ambient-glow::before, .ambient-glow::after{
    content:''; position:absolute; width:46vw; height:46vw; border-radius:50%; filter:blur(90px);
  }
  .ambient-glow::before{ top:-10%; left:-8%; background:radial-gradient(circle, var(--accent-1), transparent 70%); opacity:.28; }
  .ambient-glow::after{ bottom:-14%; right:-8%; background:radial-gradient(circle, var(--accent-2), transparent 70%); opacity:.24; }
  #mouseFollowDot{
    position:fixed; top:0; left:0; width:10px; height:10px; border-radius:50%;
    background:var(--accent-1); box-shadow:0 0 14px 3px var(--accent-1);
    pointer-events:none; z-index:400; opacity:0; transition:opacity .3s ease;
    transform:translate(-50%,-50%);
  }
  #mouseFollowDot.on{ opacity:0.9; }
  #cursorGlow{
    position:fixed; top:0; left:0; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, var(--accent-1) 0%, transparent 70%);
    pointer-events:none; z-index:1; opacity:0; transition:opacity .4s ease;
    transform:translate(-50%,-50%); mix-blend-mode:screen; filter:blur(10px);
  }
  #cursorGlow.on{ opacity:0.16; }
  .clock-weather{ color:var(--text-2); font-size:13px; margin-top:4px; display:none; align-items:center; justify-content:center; gap:5px; }
  .clock-weather.on{ display:flex; }

  /* ---------- Clock ---------- */
  .clock-wrap{ text-align:center; margin-bottom:26px; }
  .clock-time{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(40px,9vw,58px);
    letter-spacing:-0.01em;
    background:linear-gradient(135deg, var(--text-0), var(--text-1));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.05;
  }
  .clock-date{ color:var(--text-2); font-size:14.5px; margin-top:6px; letter-spacing:0.01em; }
  .clock-time.solid{ background:none; -webkit-text-fill-color:initial; color:var(--text-0); }
  .home-title{ font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--text-1); text-align:center; display:none; margin-bottom:2px; }
  .home-title.on{ display:block; }
  .home-subtitle{ font-size:12.5px; color:var(--text-2); text-align:center; display:none; margin-bottom:14px; }
  .home-subtitle.on{ display:block; }

  /* ---------- Logo ---------- */
  .logo-wrap{ margin-bottom:8px; display:flex; justify-content:center; }
  .logo-mark{
    width:56px; height:56px;
    animation: floatLogo 6s ease-in-out infinite;
    filter:drop-shadow(0 0 18px rgba(95,168,255,0.35));
    transition:filter .5s ease, transform .5s ease;
  }
  .logo-mark.glow{ filter:drop-shadow(0 0 36px rgba(95,168,255,0.75)) drop-shadow(0 0 60px rgba(176,107,255,0.4)); }
  @keyframes floatLogo{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-6px) rotate(2deg); }
  }

  /* ---------- Search ---------- */
  .search-wrap{ width:100%; max-width:600px; margin:22px 0 40px; }
  .search-bar{
    position:relative;
    display:flex; align-items:center; gap:12px;
    padding:17px 20px;
    border-radius:999px;
    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(24px);
    box-shadow:var(--shadow-soft);
    transition:box-shadow .35s ease, border-color .35s ease, transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .search-bar::before{
    content:''; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background:var(--accent-grad);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .4s ease; pointer-events:none;
  }
  .search-bar:hover{ transform:translateY(-2px); }
  .search-bar:hover::before{ opacity:0.55; }
  .search-bar svg{ width:19px; height:19px; color:var(--text-2); flex-shrink:0; }
  .voice-btn{ background:none; border:none; padding:0; display:flex; align-items:center; cursor:pointer; color:var(--text-2); transition:color .2s ease; }
  .voice-btn:hover{ color:var(--accent-1); }
  .voice-btn.listening{ color:var(--accent-1); animation:orbFloat 1s ease-in-out infinite; }
  .search-bar input{
    flex:1; background:none; border:none; outline:none;
    color:var(--text-0); font-size:16px; font-family:var(--font-body);
  }
  .search-bar input::placeholder{ color:var(--text-2); }
  .search-bar.focused{
    border-color:var(--border-strong);
    box-shadow:0 0 0 1px rgba(95,168,255,0.3), 0 0 40px rgba(95,168,255,0.22), var(--shadow-soft);
    transform:translateY(-2px);
  }
  /* ---------- Quick access ---------- */
  .grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(var(--cols, 6), 1fr);
    gap:14px;
    margin-bottom:36px;
  }
  .grid.sz-small .card{ padding:10px 4px 8px; }
  .grid.sz-small .card .ic{ width:28px; height:28px; font-size:13px; border-radius:50%; }
  .grid.sz-small .card .name{ font-size:10px; }
  .grid.sz-large .card{ padding:20px 10px 16px; }
  .grid.sz-large .card .ic{ width:44px; height:44px; font-size:21px; border-radius:50%; }
  .grid.sz-large .card .name{ font-size:12.5px; }
  .grid.no-labels .card .name{ display:none; }
  .grid.no-labels .card{ gap:0; }
  @media (max-width:640px){ .grid{ grid-template-columns:repeat(min(var(--cols,6),4), 1fr); } }
  @media (max-width:380px){ .grid{ grid-template-columns:repeat(min(var(--cols,6),3), 1fr); } }
  .card{
    position:relative;
    overflow:hidden;
    padding:16px 8px 14px;
    border-radius:var(--radius-md);
    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), background .3s ease, border-color .3s ease, box-shadow .3s ease;
    opacity:0;
    animation:cardIn .55s ease forwards;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .card::after{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
    background:conic-gradient(from 0deg, var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:0; transition:opacity .35s ease; pointer-events:none;
  }
  .card:hover{
    transform:translateY(-7px) scale(1.045);
    background:var(--glass-strong);
    border-color:var(--border-strong);
    box-shadow:0 22px 46px -18px rgba(0,0,0,0.55), 0 0 30px -6px rgba(95,168,255,0.35);
  }
  .card:hover::after{ opacity:1; }
  .card:hover .ic{
    transform:scale(1.14) rotate(-4deg);
    background:linear-gradient(135deg, rgba(95,168,255,0.32), rgba(176,107,255,0.26));
  }
  .card.add-card:hover .ic{ transform:scale(1.14) rotate(90deg); }
  .card.glowpulse{ animation:cardGlow 1.1s ease; }
  @keyframes cardGlow{
    0%{ box-shadow:0 0 0 0 rgba(95,168,255,0); }
    40%{ box-shadow:0 0 30px 2px rgba(95,168,255,0.35); }
    100%{ box-shadow:0 0 0 0 rgba(95,168,255,0); }
  }
  .card .ic{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    background:linear-gradient(135deg, rgba(95,168,255,0.18), rgba(176,107,255,0.14));
    border:1px solid var(--border);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), background .3s ease;
  }
  .card .ic img{ width:20px; height:20px; object-fit:contain; }
  .grid.sz-small .card .ic img{ width:16px; height:16px; }
  .grid.sz-large .card .ic img{ width:24px; height:24px; }
  .card.add-card{ border-style:dashed; border-color:var(--border-strong); background:transparent; }
  .card.add-card .ic{ background:transparent; border-style:dashed; color:var(--accent-1); }
  .card.add-card:hover{ background:var(--glass); }
  .field{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg-0); color:var(--text-0); outline:none; font-size:13.5px;
    font-family:var(--font-body); margin-bottom:12px;
  }
  .field:focus{ border-color:var(--border-strong); }
  .add-submit{
    width:100%; padding:13px; border-radius:12px; border:none;
    background:var(--accent-grad); color:#0a0c12; font-weight:600; cursor:pointer; font-size:13.5px;
  }
  .card .name{ font-size:11.5px; font-weight:500; color:var(--text-1); text-align:center; }
  .ripple{
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.35);
    transform:scale(0); animation:rippleAnim .6s ease-out;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(2.8); opacity:0; } }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,5,10,0.55);
    backdrop-filter:blur(6px);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:200; opacity:0; pointer-events:none;
    transition:opacity .3s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    width:100%; max-width:420px;
    background:var(--bg-1);
    border:1px solid var(--border-strong);
    border-bottom:none;
    border-radius:26px 26px 0 0;
    padding:24px 24px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(24px);
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -20px 60px rgba(0,0,0,0.5);
  }
  .modal-overlay.open .modal{ transform:translateY(0); }
  @media (min-width:640px){
    .modal-overlay{ align-items:center; }
    .modal{ border-radius:24px; transform:translateY(12px) scale(.97); }
    .modal-overlay.open .modal{ transform:translateY(0) scale(1); }
  }
  .modal-handle{ width:36px; height:4px; border-radius:999px; background:var(--border-strong); margin:0 auto 18px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-family:var(--font-display); font-weight:600; font-size:18px; }
  .modal-close{
    width:32px; height:32px; border-radius:50%; background:var(--glass);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-1);
  }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 2px; border-bottom:1px solid var(--border); }
  .settings-row:last-of-type{ border-bottom:none; }
  .settings-row .label{ font-size:14px; color:var(--text-0); }
  .seg{ display:flex; background:var(--bg-0); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .seg button{ padding:7px 14px; border-radius:999px; border:none; background:none; color:var(--text-2); font-size:12.5px; cursor:pointer; font-family:var(--font-body); }

  /* Validate + normalise a URL typed by the user. Returns {url, key} or {err}. The URL text itself is never rewritten except for adding https:// when no scheme was typed. */
  function parseUrl(raw){
    let u = String(raw||'').trim();
    if(!u) return { err:'Please enter a URL' };
    if(/\s/.test(u)) return { err:'URL cannot contain spaces' };
    if(!/^https?:\/\//i.test(u)){
      if(/^[a-z][a-z0-9+.-]*:/i.test(u) && !/^[^\/]+:\d+/.test(u)) return { err:'Only http:// or https:// links are allowed' };
      u = 'https://' + u;
    }
    let o;
    try{ o = new URL(u); }catch(e){ return { err:'This URL is not valid' }; }
    if(o.protocol!=='http:' && o.protocol!=='https:') return { err:'Only http:// or https:// links are allowed' };
    const h = o.hostname;
    if(!(h.indexOf('.')>0 || h==='localhost') || /\.$/.test(h)) return { err:'Enter a valid website address (e.g. example.com)' };

  async function fetchWeatherAt(latitude, longitude){
    try{

      const data = await res.json();
      const t = Math.round(data.current.temperature_2m);

      const icon = code===0?'☀️':code<=3?'⛅':code<=48?'🌫️':code<=67?'🌧️':code<=77?'❄️':code<=82?'🌦️':'⛈️';

  function makeNode(style){

  function resizeNetwork(){

          }
        }
        if(n.delay > 0) continue;
        const grad = pCtx.createLinearGradient(n.x, n.y, n.x - n.vx*8, n.y - n.vy*8);
        grad.addColorStop(0, n.c); grad.addColorStop(1, 'transparent');
        pCtx.strokeStyle = grad; pCtx.lineWidth = 2; pCtx.globalAlpha = 0.8;
        pCtx.beginPath(); pCtx.moveTo(n.x, n.y); pCtx.lineTo(n.x - n.vx*8, n.y - n.vy*8); pCtx.stroke();
      }
    }

    else if(style === 'matrix'){
      pCtx.font = '13px monospace';
      for(const n of nodes){
        if(motionOn){
          n.y += n.vy; n.tick++;
          if(n.tick % 8 === 0) n.ch = String.fromCharCode(0x30A0+Math.random()*96);
          if(n.y > netH + 20){ n.y = -Math.random()*netH*0.5; n.x = Math.random()*netW; }
        }
        pCtx.fillStyle = n.c; pCtx.globalAlpha = 0.55;
        pCtx.fillText(n.ch, n.x, n.y);
      }
    }

    else if(style === 'aurora'){
      const bandColors = accentColors();
      for(const n of nodes){
        if(motionOn) n.phase += n.sp;
        const baseY = netH*0.15 + n.band*netH*0.16;
        pCtx.beginPath();
        for(let x=0; x<=netW; x+=20){
          const y = baseY + Math.sin(x*0.006 + n.phase)*n.amp + Math.sin(x*0.002+n.phase*1.4)*n.amp*0.5;
          if(x===0) pCtx.moveTo(x,y); else pCtx.lineTo(x,y);
        }
        pCtx.strokeStyle = bandColors[n.band % bandColors.length];
        pCtx.lineWidth = 40; pCtx.globalAlpha = 0.05; pCtx.filter = 'blur(2px)';
        pCtx.stroke();
      }
      pCtx.filter = 'none';
    }

    else if(style === 'fireflies'){
      for(const n of nodes){
        if(motionOn){
          n.tw += n.sp;
          n.x += n.vx + Math.sin(n.tw*0.7)*0.3;
          n.y += n.vy + Math.cos(n.tw*0.5)*0.3;
          if(n.x<0) n.x=netW; if(n.x>netW) n.x=0;
          if(n.y<0) n.y=netH; if(n.y>netH) n.y=0;
        }
        const a = 0.25 + Math.abs(Math.sin(n.tw)) * 0.6;
        pCtx.beginPath(); pCtx.arc(n.x, n.y, n.r*2.2, 0, Math.PI*2);
        pCtx.fillStyle = n.c; pCtx.globalAlpha = a*0.25; pCtx.fill();
        pCtx.beginPath(); pCtx.arc(n.x, n.y, n.r, 0, Math.PI*2);
        pCtx.globalAlpha = a; pCtx.fill();
      }
    }

    else if(style === 'ambient'){
      for(const n of nodes){
        if(motionOn) n.phase += n.sp;
        pCtx.beginPath();
        for(let x=0; x<=netW; x+=24){
          const y = n.yBase + Math.sin(x*0.008 + n.phase)*n.amp;
          if(x===0) pCtx.moveTo(x,y); else pCtx.lineTo(x,y);
        }
        pCtx.strokeStyle = n.c; pCtx.lineWidth = 1.4; pCtx.globalAlpha = 0.12;
        pCtx.stroke();
      }
    }

    pCtx.globalAlpha = 1;
  }

  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    let str;
    if(state.clock24h){
      str = String(h).padStart(2,'0')+':'+m + (state.clockSeconds ? ':'+s : '');
    } else {
      const ampm = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12; if(h12===0) h12 = 12;
      str = String(h12).padStart(2,'0')+':'+m + (state.clockSeconds ? ':'+s : '') + ' ' + ampm;
    }
    document.getElementById('clockTime').textContent = str;
    let dateStr;
    if(state.clockDateFormat === 'short'){
      dateStr = now.toLocaleDateString(undefined, { year:'numeric', month:'2-digit', day:'2-digit' });
    } else if(state.clockDateFormat === 'iso'){
      dateStr = now.toISOString().slice(0,10);
    } else {
      dateStr = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
    }
    document.getElementById('clockDate').textContent = dateStr;
  }

  function initVoiceSearch(){

    btn.style.display = state.searchVoice ? '' : 'none';

  function ripple(el, e){
    playClick();
    if(!state.fxClickRipple) return;
    const rect = el.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size+'px';
    const x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
    const y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
    r.style.left = x+'px'; r.style.top = y+'px';
    el.appendChild(r);
    setTimeout(()=> r.remove(), 650);
  }

  function spawnBurst(originEl){
    const rect = originEl.getBoundingClientRect();
    const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    const n = 14;
    for(let i=0;i<n;i++){
      const p = document.createElement('div');
      p.className = 'burst-particle';
      const angle = (Math.PI*2*i)/n + Math.random()*0.3;
      const dist = 60 + Math.random()*60;
      p.style.setProperty('--bx', Math.cos(angle)*dist+'px');
      p.style.setProperty('--by', Math.sin(angle)*dist+'px');
      p.style.left = cx+'px'; p.style.top = cy+'px';
      p.style.background = i%2===0 ? 'var(--accent-1)' : 'var(--accent-2)';
      burstLayer.appendChild(p);
      setTimeout(()=> p.remove(), 1000);
    }
  }

  /* ---------- Cursor-based effects: parallax, mouse-follow dot, cursor glow ---------- */
  function initCursorEffects(){

    let rafPending = false, lastX = 0, lastY = 0;
    window.addEventListener('mousemove', (e)=>{
      lastX = e.clientX; lastY = e.clientY;
      if(rafPending) return;
      rafPending = true;
      requestAnimationFrame(()=>{
        rafPending = false;
        if(state.fxMouseFollow && mfd){ mfd.style.transform = `translate(${lastX}px, ${lastY}px) translate(-50%,-50%)`; }
        if(state.fxCursorGlow && cg){ cg.style.transform = `translate(${lastX}px, ${lastY}px) translate(-50%,-50%)`; }
        if(state.fxParallax && state.animations && !state.extraReduceMotion){
          const cx = window.innerWidth/2, cy = window.innerHeight/2;
          const dx = (lastX - cx) / cx, dy = (lastY - cy) / cy;
          logoMark.style.transform = `translate(${dx*6}px, ${dy*6}px)`;
          const sb = document.querySelector('.search-bar');

    const curCat = existing ? (existing.cat||'more') : 'more';
    const EMOJIS = ['🔗','⭐','💼','🏦','📊','💰','📁','🎮','🎬','📚','🛒','✉️'];

      ${editing ? '<button class="reset-btn" id="deleteSubmit" style="margin-top:10px;">🗑 Delete shortcut</button>' : ''}
    `;
    const nameEl = document.getElementById('newName'), urlEl = document.getElementById('newUrl'),
          iconEl = document.getElementById('newIcon'), catEl = document.getElementById('newCat'),
          errEl = document.getElementById('formErr'), picks = document.getElementById('iconPicks');
    if(textIcon) iconMode = 'emoji';
    function clearActive(){ picks.querySelectorAll('.pick').forEach(p=>p.classList.remove('active')); }
    picks.addEventListener('click', (e)=>{
      const b = e.target.closest('.pick'); if(!b) return;
      clearActive(); b.classList.add('active');
      if(b.dataset.mode){ iconMode = b.dataset.mode; iconEl.value = ''; }
      else { iconMode = 'emoji'; iconEl.value = b.dataset.emoji; }
    });
    iconEl.addEventListener('input', ()=>{ if(iconEl.value.trim()){ iconMode = 'emoji'; clearActive(); } });
    function fail(msg, el){
      errEl.textContent = msg;
      [nameEl, urlEl].forEach(x=>x.classList.remove('invalid'));
      if(el){ el.classList.add('invalid'); try{ el.focus(); }catch(_){} }
      showToast(msg);
    }
    document.getElementById('addSubmit').addEventListener('click', ()=>{
      const name = nameEl.value.trim();
      if(!name) return fail('Please enter a name', nameEl);
      const pu = parseUrl(urlEl.value);
      if(pu.err) return fail(pu.err, urlEl);
      state.shortcuts = state.shortcuts || [];
      const dup = state.shortcuts.some((s,i)=> i !== editIndex && keyOf(s.url) === pu.key);
      if(dup) return fail('This URL is already in your shortcuts', urlEl);

        icon = existing.icon;

      const cat = validCat(catEl.value) || 'more';
      if(editing){ state.shortcuts[editIndex] = Object.assign({}, existing, { name, url:pu.url, icon, cat }); }

  function moveShortcut(i, dir){
    const arr = state.shortcuts; if(!arr || !arr[i]) return;
    const cat = arr[i].cat || 'more';
    let j = i + dir;
    while(j >= 0 && j < arr.length && (arr[j].cat||'more') !== cat) j += dir;
    if(j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    saveState(); renderGrid(); renderManageList(); playClick();
  }
  function renderManageList(){
    const list = document.getElementById('manageList');
    if(!list) return;
    const items = state.shortcuts || [];
    let html = '';
    CATS.forEach(cat=>{
      const idx = [];
      items.forEach((it,i)=>{ if((it.cat||'more')===cat.id) idx.push(i); });
      if(!idx.length) return;
      html += `<div class="manage-cat">${cat.label}</div>`;
      idx.forEach((i,pos)=>{
        const item = items[i];
        html += `
      <div class="manage-row" draggable="true" data-i="${i}" data-cat="${cat.id}">
        <div class="handle">☰</div>
        <div class="ic">${iconHtml(item.icon)}</div>
        <div class="t1">${escapeHtml(item.name)}</div>
        <button type="button" class="mv-btn" data-up="${i}" aria-label="Move up" ${pos===0?'disabled':''}>▲</button>
        <button type="button" class="mv-btn" data-down="${i}" aria-label="Move down" ${pos===idx.length-1?'disabled':''}>▼</button>
        <div class="edit-btn" data-edit="${i}">✏️</div>
      </div>`;
      });
    });
    list.innerHTML = html;
    list.querySelectorAll('.edit-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ playClick(); openAddShortcut(Number(btn.dataset.edit)); });
    });
    list.querySelectorAll('[data-up]').forEach(b=> b.addEventListener('click', ()=> moveShortcut(Number(b.dataset.up), -1)));
    list.querySelectorAll('[data-down]').forEach(b=> b.addEventListener('click', ()=> moveShortcut(Number(b.dataset.down), 1)));
    // Drag & drop reorder (desktop). On touch screens use the ▲ ▼ buttons.
    let dragIdx = null;
    list.querySelectorAll('.manage-row').forEach(row=>{
      row.addEventListener('dragstart', ()=>{ dragIdx = Number(row.dataset.i); row.classList.add('dragging'); });
      row.addEventListener('dragend', ()=>{ row.classList.remove('dragging'); });
      row.addEventListener('dragover', (e)=>{ e.preventDefault(); });
      row.addEventListener('drop', (e)=>{
        e.preventDefault();
        const dropIdx = Number(row.dataset.i);
        if(dragIdx === null || dragIdx === dropIdx) return;
        const arr = state.shortcuts;
        if((arr[dragIdx].cat||'more') !== (arr[dropIdx].cat||'more')){ showToast('Reorder inside the same category (change category via ✏️)'); return; }
        const [moved] = arr.splice(dragIdx, 1);
        arr.splice(dropIdx, 0, moved);
        saveState(); renderGrid(); renderManageList(); playClick();
      });
    });
  }

  /* ---------- Modal scroll lock (prevents Android Chrome jump/shift on open) ---------- */
  let _savedScrollY = 0;
  let _bodyLocked = false;
  function lockBodyScroll(){
    if(_bodyLocked) return;
    _bodyLocked = true;
    _savedScrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${_savedScrollY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    document.body.style.overflow = 'hidden';
  }
  function unlockBodyScroll(){
    if(!_bodyLocked) return;
    _bodyLocked = false;
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    document.body.style.overflow = '';
    window.scrollTo(0, _savedScrollY);
  }

  function openSettings(){
    lockBodyScroll();
    document.querySelector('.modal').classList.add('wide');
    modalTitleEl.textContent = '⚙️ Settings';
    modalBody.innerHTML = `
      <div class="settings-tabs" id="settingsTabs">
        <button class="tab-chip active" data-tab="appearance">🎨 Appearance</button>
        <button class="tab-chip" data-tab="background">✨ Background</button>
        <button class="tab-chip" data-tab="effects">🌟 Effects</button>
        <button class="tab-chip" data-tab="home">🏠 Home</button>
        <button class="tab-chip" data-tab="search">🔍 Search</button>
        <button class="tab-chip" data-tab="shortcuts">🔗 Shortcuts</button>
        <button class="tab-chip" data-tab="performance">⚡ Performance</button>
        <button class="tab-chip" data-tab="privacy">🔒 Privacy</button>
      </div>
      <div class="settings-content" id="settingsContent"></div>
      <div class="settings-foot">
        <button class="reset-btn" id="resetBtn">↺ Reset All</button>
        <button class="save-btn" id="saveBtn">✓ Save &amp; Close</button>
      </div>
    `;
    renderTab('appearance');
    document.getElementById('settingsTabs').addEventListener('click', (e)=>{
      const chip = e.target.closest('.tab-chip');
      if(!chip) return;
      playClick();
      document.querySelectorAll('.tab-chip').forEach(c=>c.classList.toggle('active', c===chip));
      renderTab(chip.dataset.tab);
    });
    document.getElementById('resetBtn').addEventListener('click', ()=>{
      localStorage.removeItem('newtab_state_v2');
      state = Object.assign({}, defaults, { shortcuts: DEFAULT_SHORTCUTS.map(x=>Object.assign({}, x)), _shortcutVersion: SHORTCUT_VERSION });
      weatherFetched = false;
      applyTheme(); applyParticles(); applyAnimations(); applyExtra(); applyEffects();
      applyHomepage(); applyBackgroundType(); applySearchOptions(); applyClockStyle();
      updateSearchPlaceholder(); resizeNetwork(); updateClock(); scheduleClock(); renderGrid();
      showToast('Settings reset');
      closeModal();
    });
    document.getElementById('saveBtn').addEventListener('click', ()=>{
      showToast('Settings saved');
      closeModal();
    });
    overlay.classList.add('open');
  }
  function closeModal(){ overlay.classList.remove('open'); unlockBodyScroll(); }
  document.getElementById('settingsBtn').addEventListener('click', (e)=>{ e.preventDefault(); openSettings(); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });



  /* ---------- Toast ---------- */
  let toastTimeout;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(()=> t.classList.remove('show'), 2400);
  }

})();
</script>
</body>
</html>
