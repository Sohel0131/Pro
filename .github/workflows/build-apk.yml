name: Build Sabika Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Capacitor project
        run: |
          test -f index.html || (echo "ERROR: index.html not found in repository root" && exit 1)
          test -f icon.png || (echo "ERROR: icon.png not found in repository root" && exit 1)

          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p www assets
          cp index.html www/index.html
          convert icon.png -resize 1024x1024^ -gravity center -extent 1024x1024 assets/icon-only.png
          convert -size 2732x2732 xc:'#080A1C' \
            \( assets/icon-only.png -resize 1024x1024 \) -gravity center -composite assets/splash.png

          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7 @capacitor/assets

          npx cap init "Sabika Pro" "com.sohelpro.sabikapro" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sabika-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
