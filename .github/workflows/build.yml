name: Build Sabika Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check required files
        run: |
          test -f index.html || { echo "ERROR: index.html is missing from repository root"; exit 1; }
          test -f icon.png || { echo "ERROR: icon.png is missing from repository root"; exit 1; }

      - name: Prepare Capacitor app and icon
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick

          mkdir -p www assets
          cp index.html www/index.html

          # Capacitor Assets expects a square 1024x1024 source icon.
          convert icon.png -resize 1024x1024^ -gravity center -extent 1024x1024 assets/icon-only.png
          convert -size 2732x2732 xc:'#080A1C' \
            \( assets/icon-only.png -resize 1024x1024 \) -gravity center -composite assets/splash.png

          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7 @capacitor/assets

          npx cap init "Sabika Pro" "com.sohelpro.sabikapro" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Sabika-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
