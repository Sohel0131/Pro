name: Build Sabika Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Prepare Capacitor project
        run: |
          test -f index.html || (echo "index.html not found" && exit 1)
          test -f icon.png || (echo "icon.png not found" && exit 1)
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7
          npx cap init "Sabika Pro" "com.sohelpro.sabikapro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon and plain splash
        run: |
          res=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; px=${d##*:}
            mkdir -p $res/mipmap-$name
            for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              convert icon.png -trim +repage -resize ${px}x${px} -background none -gravity center -extent ${px}x${px} $res/mipmap-$name/$f
            done
          done
          rm -f $res/mipmap-anydpi*/*.xml
          find $res -path "*drawable*" -name "splash*.png" -delete
          mkdir -p $res/drawable $res/values-v31
          printf '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n<solid android:color="#080A1C"/>\n</shape>\n' > $res/drawable/splash.xml
          convert -size 432x432 xc:none $res/drawable/splash_icon.png
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">\n<item name="android:windowSplashScreenBackground">#080A1C</item>\n<item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>\n</style>\n</resources>\n' > $res/values-v31/styles.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Sabika-Pro-APK
